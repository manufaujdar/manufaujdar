minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: staged-secrets
        name: Redacted staged secrets
        entry: betterleaks git --pre-commit --staged --redact=100 --no-banner
        language: system
        pass_filenames: false
        always_run: true
