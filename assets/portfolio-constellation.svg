<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Manu Faujdar portfolio constellation</title>
  <desc id="desc">A central health and AI node connected to four orbiting domains: trustworthy AI, clinical interfaces, translational research, and creative systems.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1120" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#111A35"/>
      <stop offset="1" stop-color="#190D2E"/>
    </linearGradient>
    <linearGradient id="cyan" x1="220" y1="90" x2="560" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68E8FF"/>
      <stop offset="1" stop-color="#4A77FF"/>
    </linearGradient>
    <linearGradient id="violet" x1="670" y1="100" x2="1010" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D29BFF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="lime" x1="250" y1="360" x2="600" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6F36B"/>
      <stop offset="1" stop-color="#3AC7A8"/>
    </linearGradient>
    <linearGradient id="orange" x1="690" y1="390" x2="1050" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB36A"/>
      <stop offset="1" stop-color="#FF6F91"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(600 260) rotate(90) scale(168)">
      <stop stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.42" stop-color="#7FE9FF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7FE9FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stars" width="78" height="78" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1" fill="#D8E8FF" fill-opacity="0.42"/>
      <circle cx="54" cy="32" r="0.8" fill="#FFFFFF" fill-opacity="0.28"/>
      <circle cx="27" cy="66" r="0.7" fill="#B9C7FF" fill-opacity="0.30"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="30" fill="url(#stars)" opacity="0.72"/>
  <ellipse cx="600" cy="260" rx="340" ry="196" stroke="#C9D9FF" stroke-opacity="0.10"/>
  <ellipse cx="600" cy="260" rx="240" ry="138" stroke="#C9D9FF" stroke-opacity="0.10" transform="rotate(-28 600 260)"/>
  <ellipse cx="600" cy="260" rx="190" ry="300" stroke="#C9D9FF" stroke-opacity="0.07" transform="rotate(38 600 260)"/>
  <circle cx="600" cy="260" r="170" fill="url(#core)"/>

  <path d="M510 218C430 177 350 140 259 122" stroke="url(#cyan)" stroke-width="2" stroke-opacity="0.68"/>
  <path d="M690 218C775 175 854 141 946 122" stroke="url(#violet)" stroke-width="2" stroke-opacity="0.68"/>
  <path d="M510 302C426 342 351 378 260 398" stroke="url(#lime)" stroke-width="2" stroke-opacity="0.68"/>
  <path d="M690 302C776 343 854 378 944 398" stroke="url(#orange)" stroke-width="2" stroke-opacity="0.68"/>

  <g filter="url(#glow)">
    <circle cx="259" cy="122" r="7" fill="#68E8FF"/>
    <circle cx="946" cy="122" r="7" fill="#D29BFF"/>
    <circle cx="260" cy="398" r="7" fill="#B6F36B"/>
    <circle cx="944" cy="398" r="7" fill="#FFB36A"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" fill="#F4F7FF">
    <text x="600" y="238" text-anchor="middle" font-size="25" font-weight="700" letter-spacing="5">MANU FAUJDAR</text>
    <text x="600" y="269" text-anchor="middle" font-size="13" letter-spacing="3" fill="#BBD0EE">HEALTH  ×  AI  ×  SYSTEMS</text>
    <text x="600" y="298" text-anchor="middle" font-size="11" fill="#8EA7CA">turning complex ideas into observable, testable work</text>

    <text x="92" y="84" font-size="11" letter-spacing="2" fill="#68E8FF">01 / TRUST</text>
    <text x="92" y="108" font-size="18" font-weight="700">Trustworthy AI</text>
    <text x="92" y="132" font-size="11" fill="#B9C8E3">privacy · routing · evaluation</text>

    <text x="855" y="84" font-size="11" letter-spacing="2" fill="#D29BFF">02 / CLINICAL</text>
    <text x="855" y="108" font-size="18" font-weight="700">Clinical Interfaces</text>
    <text x="855" y="132" font-size="11" fill="#C9BFE8">devices · workflow · care</text>

    <text x="92" y="435" font-size="11" letter-spacing="2" fill="#B6F36B">03 / RESEARCH</text>
    <text x="92" y="459" font-size="18" font-weight="700">Translational Research</text>
    <text x="92" y="483" font-size="11" fill="#C5E3BE">evidence · validation · biology</text>

    <text x="855" y="435" font-size="11" letter-spacing="2" fill="#FFB36A">04 / CREATE</text>
    <text x="855" y="459" font-size="18" font-weight="700">Creative Systems</text>
    <text x="855" y="483" font-size="11" fill="#F1CBB3">products · media · interfaces</text>
  </g>

  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="398" cy="71" r="1.5"/><circle cx="776" cy="72" r="1.5"/>
    <circle cx="374" cy="449" r="1.5"/><circle cx="817" cy="453" r="1.5"/>
  </g>
</svg>
