	<title id="title">M in Morse code</title>
	<desc id="description">Two horizontal dashes representing the letter M in Morse code.</desc>
	<rect x="12" y="44" width="44" height="40" rx="8" fill="#000" />
	<rect x="72" y="44" width="44" height="40" rx="8" fill="#000" />
